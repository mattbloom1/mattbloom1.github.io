<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Design tools, photo galleries, and property websites built for The GVC Team at Douglas Elliman.">

<meta property="og:image" content="https://mattbloom1.github.io/assets/img/tile-photo.jpg">
<meta property="og:url" content="https://mattbloom1.github.io/">

<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logos/monogram.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logos/monogram-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logos/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/css/base.css">

<body data-root="" data-nav="home">
<main class="page">
  <h1 class="visually-hidden">Matt Bloomfield — Portfolio</h1>
  <section class="bento" aria-label="Projects">

    <!-- Photo Editing: 2×2 feature tile -->
    <div class="tile h2 w2 has-img feature" data-enter>
      <div class="tile-img"><img src="assets/img/tile-photo.jpg" alt="Edited interior photo, 120 East 75th" fetchpriority="high"></div>
      <div class="tile-cap">
        <span class="t-mono">13 property galleries</span>
        <span class="tile-name">Photo Editing</span>
      </div>
    </div>

    <!-- Map Studio: 1×2 (w2), navy fallback -->
    <div class="tile navy w2" data-enter>
      <div class="tile-cap">
        <span class="t-mono">Address list → 3D map → export</span>
        <span class="tile-name">Map Studio</span>
      </div>
    </div>

    <!-- Showsheet Generator: 1×1, live tool -->
    <a class="tile has-img crop-top" href="tools/showsheet/" data-enter>
      <div class="tile-img"><img src="assets/img/tile-showsheet.webp" alt="" loading="lazy"></div>
      <div class="tile-cap">
        <span class="t-mono">Tool</span>
        <span class="tile-name">Showsheet Generator</span>
      </div>
    </a>

    <!-- Floorplan Converter: 1×1, navy fallback -->
    <div class="tile navy" data-enter>
      <div class="tile-cap">
        <span class="t-mono">Tool</span>
        <span class="tile-name">Floorplan Converter</span>
      </div>
    </div>

    <!-- Feet & Inches Calculator: 1×1, live tool -->
    <a class="tile navy" href="tools/calculator/" data-enter>
      <div class="tile-glyph" aria-hidden="true">5&prime;3&Prime;</div>
      <div class="tile-cap">
        <span class="t-mono">Tool</span>
        <span class="tile-name">Feet &amp; Inches Calculator</span>
      </div>
    </a>

    <!-- GitHub: 1×1, live link -->
    <a class="tile" href="https://github.com/mattbloom1" target="_blank" rel="noopener" data-enter>
      <div class="tile-cap">
        <span class="t-mono">github.com/mattbloom1 <span aria-hidden="true">↗</span></span>
        <span class="tile-name">Source</span>
      </div>
    </a>

    <!-- Casa Avenida: 1×2 (w2), live link -->
    <a class="tile has-img w2 crop-top" href="projects/casa-avenida/" data-enter>
      <div class="tile-img"><img src="assets/img/tile-casa.webp" alt="" loading="lazy"></div>
      <div class="tile-cap">
        <span class="t-mono">Website</span>
        <span class="tile-name">Casa Avenida</span>
      </div>
    </a>

    <!-- Le Rêve: 1×2 (w2), live link -->
    <a class="tile has-img w2 crop-top" href="projects/le-reve/" data-enter>
      <div class="tile-img"><img src="assets/img/tile-lereve.webp" alt="" loading="lazy"></div>
      <div class="tile-cap">
        <span class="t-mono">Website</span>
        <span class="tile-name">Le Rêve</span>
      </div>
    </a>

  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc" crossorigin="anonymous"></script>
<script src="assets/js/chrome.js"></script>
<script src="assets/js/motion.js"></script>
</body>
</html>
