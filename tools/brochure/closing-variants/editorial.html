<!--
================================================================================
DESIGN NOTES — "EDITORIAL" closing page (proposal, standalone preview)
================================================================================
CONCEPT
  The closing spread of an architecture magazine rather than a business
  back-cover. One asymmetric column structure runs the whole page: a wide
  portrait rail on the LEFT whose cut-outs bleed off the trimmed paper edge,
  and a narrower typographic column on the RIGHT carrying the sign-off, the
  names and the contact matter. Hairline rules do all the organising; white
  space is a compositional element, not leftover. Big Fraunces set tight and
  ragged, hung against the rail rather than centred over it.

STRUCTURALLY DIFFERENT FROM THE CURRENT PAGE
  - No centred stack anywhere. Today's .cx-top / .ag-row / .lcols / .states are
    all text-align:center; every element here is left-aligned to one of two
    column edges.
  - Uneven margins by design: .58in left, .92in right. The portraits break the
    left margin entirely and run off the sheet, instead of sitting in a
    light-on-navy card with a drop shadow. The cards are gone.
  - Each agent is an editorial ROW (bleed portrait + details on the right),
    stacked and divided by hairlines, rather than two cards side by side. The
    two rows are split unevenly (1.22 : 1) and the second cut-out is set in
    from the trim, so the pair staggers instead of stacking squarely.
  - The three state marks leave their centred row for a stacked right-hand
    block in the footer grid, mark + label on one line.
  - The QR anchors the right end of a header rule whose left end carries a
    micro-label, so the top of the page is a rule, not a centred title.

HOW THE TWO PAPER SIZES ARE ABSORBED
  The design canvas is always 8.5in wide; the half-letter sheet is the same
  canvas at 8.5 x 13.1364in printed at 0.647 scale, so it carries 2.14in of
  extra proportional height. That height goes into the agent rows, which are
  flex:1 and share it. Each cut-out is absolutely pinned to its row box at a
  fixed rail width with object-fit:contain and a bottom-left origin, so a
  taller row prints a bigger figure standing on the same hairline, up to the
  rail width — the extra height reads as a bigger portrait and more air above
  it, not as one conspicuous void, and the row can never be pushed taller than
  its flex share. The solo case widens both the rail and the figure so one
  agent still fills the column. Verified at both sizes and both agent counts:
  nothing overflows the page box and no contact line is ellipsised.

RISK TO INTEGRATING INTO renderAgent()
  Low-to-moderate. The content is identical to today's, so the data plumbing
  (agentObjs, headshotFor, socialRows, AG_LINKS, STATES, GVC_LEGAL.block,
  pageFoot, qrSvg) is unchanged. But this markup does NOT reuse P.agentCards()
  or P.linkCols() from assets/js/pitch.js — those emit the centred card and
  column structure. Adopting it means renderAgent() builds its own agent rows
  and contact columns locally (or pitch.js gains a second emitter), and the
  brochure's duplicated copy of pitch.css's CLOSING PAGE block would
  deliberately diverge from the Seller Pitch & CMA and the Buyer Package, which
  that CSS comment asks to keep in step. That is a decision, not a bug. Also:
  the bleed portraits rely on .ag having overflow:hidden (it already does) and
  on the headshots being square transparent cut-outs (they are). Three or more
  agents is not supported by this composition — the same two-across limit the
  current page has.
================================================================================
-->

<style>
:root{
  --navy:#00273A; --paper:#EFEDE8; --sky:#53C7DC; --cyan:#00A1C4; --bone:#E5E5E5;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Nunito Sans',system-ui,sans-serif;
  --body:'Raleway',system-ui,sans-serif;
  --rule:rgba(229,229,229,.26);
  --rule-soft:rgba(229,229,229,.14);
  --mesh:linear-gradient(135deg,#53C7DC 0%,#00A1C4 55%,#0E5E77 100%);
  --ph:11in;
  --padL:.58in; --padR:.92in; --padT:.5in; --padB:.42in;
  --rail:2.55in;   /* portrait rail, measured from the trimmed edge */
  --gut:.5in;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#8f9195;font-family:var(--body);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;}

/* ---------- proof-sheet chrome (screen only, not part of the design) ---------- */
.proofs{padding:34px 30px 60px;display:flex;flex-wrap:wrap;gap:36px;
  align-items:flex-start;justify-content:center;}
.cap{font:800 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#fff;
  margin:0 0 9px 2px;text-shadow:0 1px 2px rgba(0,0,0,.35);}
.cap small{display:block;font:400 11px var(--body);letter-spacing:.02em;
  text-transform:none;color:rgba(255,255,255,.82);margin-top:2px;}
.holder{position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.holder > .sheet{position:absolute;top:0;left:0;transform-origin:0 0;}

/* ---------- the printed page ---------- */
.sheet{width:8.5in;height:var(--ph);position:relative;overflow:hidden;
  background:var(--navy);color:var(--bone);}
.sheet.half{--ph:13.1364in;}
/* a whisper of brand light in the corner the portrait bleeds through */
.sheet::before{content:'';position:absolute;left:-1.7in;top:-1.7in;width:6.4in;height:6.4in;
  background:radial-gradient(circle at 50% 50%,rgba(83,199,220,.17),rgba(83,199,220,0) 68%);}

.body{position:absolute;inset:0;padding:var(--padT) var(--padR) var(--padB) var(--padL);
  display:flex;flex-direction:column;}

/* ---------- header rule: micro-label far left, QR far right ---------- */
.hdr{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:.4in;
  padding-bottom:.14in;border-bottom:1pt solid var(--rule);}
.hdr .mark{padding-top:.03in;}
.hdr .mark .l1{font:900 8pt var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--sky);}
.hdr .mark .l2{margin-top:.06in;font:400 6.2pt var(--sans);letter-spacing:.26em;
  text-transform:uppercase;color:rgba(229,229,229,.5);}
.qr{flex:none;width:.86in;}
.qr .qbox{width:.86in;height:.86in;background:#fff;padding:.05in;}
.qr .qbox svg{display:block;width:100%;height:100%;}
.qr .qcap{margin-top:.05in;font:800 6.2pt var(--sans);letter-spacing:.12em;
  text-transform:uppercase;color:rgba(229,229,229,.62);}

/* ---------- the sign-off, hung in the right column ---------- */
.hero{flex:none;display:grid;grid-template-columns:var(--rail) 1fr;column-gap:var(--gut);
  padding:.26in 0 .22in;}
.hero .lead{grid-column:1;align-self:end;}
.hero .lead .rulet{width:1.05in;height:1.5pt;background:var(--sky);margin-bottom:.15in;}
.hero .lead p{font:300 9.5pt/1.6 var(--body);color:rgba(229,229,229,.78);max-width:2.7in;}
.hero .say{grid-column:2;}
.hero .say h2{font:700 36pt/.94 var(--serif);color:#fff;letter-spacing:-.012em;}
.hero .say h2 em{display:block;font-style:normal;color:var(--sky);}
.hero .say .sign{margin-top:.12in;padding-top:.1in;border-top:.75pt solid var(--rule-soft);
  font:800 7pt/1.5 var(--sans);letter-spacing:.22em;text-transform:uppercase;
  color:rgba(229,229,229,.72);}

/* ---------- agent rows: the cut-out bleeds off the left trim ---------- */
.people{flex:1;min-height:0;display:flex;flex-direction:column;}
.person{position:relative;flex:1;min-height:0;
  display:grid;grid-template-columns:var(--rail) 1fr;
  column-gap:var(--gut);align-items:end;
  border-top:1pt solid var(--rule);padding-top:.16in;}
/* An uneven split: the first agent takes the larger share, so the two rows
   read as a staggered editorial pair rather than two equal bands. */
.person:first-child{flex:1.22;}
.person + .person{margin-top:.14in;}
/* The cut-out is taken out of the grid flow and pinned to the row box, so its
   height is definite (top/bottom) and it can never push the row taller than
   its flex share. It breaks the left margin and runs off the trimmed edge. */
.shot{position:absolute;left:calc(var(--padL) * -1);top:.16in;bottom:0;
  width:calc(var(--rail) + var(--padL));overflow:hidden;}
.shot img{position:absolute;left:0;bottom:0;top:0;width:2.62in;
  display:block;object-fit:contain;object-position:0 100%;}
/* the second cut-out is set in from the trim, so the pair staggers across the
   rail instead of both figures hanging on the same edge */
.person + .person .shot img{left:.42in;}
.who{grid-column:2;min-width:0;padding-bottom:.07in;}
.who .idx{font:900 6.2pt var(--sans);letter-spacing:.28em;text-transform:uppercase;
  color:rgba(83,199,220,.8);margin-bottom:.09in;}
.who .nm{font:700 21pt/1.03 var(--serif);color:#fff;letter-spacing:-.008em;}
.who .tt{margin-top:.11in;padding-top:.09in;border-top:.75pt solid var(--rule-soft);
  font:800 6.8pt/1.5 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--sky);}
.who .ct{margin-top:.14in;display:flex;flex-direction:column;gap:.055in;}
.who .ct div{display:flex;align-items:baseline;gap:.13in;min-width:0;}
.who .ct .k{flex:none;width:.36in;font:800 6.2pt var(--sans);letter-spacing:.16em;
  text-transform:uppercase;color:rgba(229,229,229,.45);}
.who .ct .v{min-width:0;font:400 10pt/1.35 var(--body);color:var(--bone);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who .ct .v.num{font:700 10.5pt var(--serif);letter-spacing:.01em;}

/* ---- solo agent: a wider rail, a bigger portrait, a bigger name ---- */
.people.solo{--rail:3.6in;}
.people.solo .shot img{width:3.72in;object-fit:contain;object-position:0 100%;}
.people.solo .who{padding-bottom:.12in;}
.people.solo .who .nm{font-size:27pt;}
.people.solo .who .tt{font-size:7.6pt;}
.people.solo .who .ct{gap:.09in;}
.people.solo .who .ct .v{font-size:11pt;}
.people.solo .who .ct .v.num{font-size:12pt;}

/* ---------- footer matter: three uneven columns ---------- */
.foot{flex:none;margin-top:.2in;padding-top:.16in;border-top:1pt solid var(--rule);
  display:grid;grid-template-columns:1.5fr 1.7fr 1.45in;column-gap:.4in;}
.col-t{font:900 6.6pt var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--sky);
  padding-bottom:.07in;margin-bottom:.09in;border-bottom:.75pt solid var(--rule-soft);}
.lrow{display:block;margin-bottom:.06in;min-width:0;}
.lrow:last-child{margin-bottom:0;}
.lrow .lk{display:block;font:800 6.2pt var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:rgba(229,229,229,.45);}
.lrow .lv{display:block;font:300 9pt/1.35 var(--body);color:var(--bone);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.st{display:flex;align-items:center;gap:.13in;margin-bottom:.055in;}
.st:last-child{margin-bottom:0;}
.st i{flex:none;display:block;width:.6in;height:.33in;background:var(--mesh) center/cover;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;}
.st span{font:800 6.6pt var(--sans);letter-spacing:.16em;text-transform:uppercase;
  color:rgba(229,229,229,.72);}

/* ---------- legal small print + page foot ---------- */
.legal{flex:none;margin-top:.16in;padding-top:.11in;border-top:.75pt solid var(--rule-soft);
  font:300 6.5pt/1.46 var(--body);color:rgba(229,229,229,.55);text-align:justify;}
.pgfoot{flex:none;margin-top:.12in;display:flex;align-items:center;
  justify-content:space-between;gap:.3in;}
.pgfoot .url{font:800 6.4pt var(--sans);letter-spacing:.2em;text-transform:uppercase;
  color:rgba(229,229,229,.5);}
.pgfoot .rt{display:flex;align-items:center;gap:.14in;}
.pgfoot .rt img{height:.2in;width:auto;display:block;opacity:.85;}
.pgfoot .no{font:700 8pt var(--serif);color:rgba(229,229,229,.65);}
</style>
</head>
