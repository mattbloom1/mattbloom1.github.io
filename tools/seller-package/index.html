<style>
/* ============================================================
   SELLER PITCH & CMA — deck-specific page styles
   Shared furniture lives in assets/css/pitch.css.
   ============================================================ */

/* ---- shared: the reference deck's three-up colour blocks ---- */
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.tri .tb{padding:.2in .18in;min-width:0;}
.tri .tb.c1{background:var(--navy);}
.tri .tb.c2{background:var(--sky2);}
.tri .tb.c3{background:var(--sky);}
.tri .tb .ci{width:.22in;height:.22in;color:#fff;margin-bottom:.09in;}
.tri .tb.c3 .ci{color:var(--navy);}
.tri .tb h4{margin:0 0 .08in;font:800 9.5pt/1.25 var(--sans);color:#fff;}
.tri .tb.c3 h4{color:var(--navy);}
.tri .tb p{margin:0;font:300 8.3pt/12.5pt var(--body);color:rgba(255,255,255,.9);}
.tri .tb.c3 p{color:rgba(0,39,58,.82);}
/* a quieter variant for short one-line claims */
.tri.flat .tb{text-align:center;padding:.24in .18in;}
.tri.flat .tb.c0{background:#EDEDEB;}
.tri.flat .tb h4{margin:0;font:400 11pt/1.4 var(--body);color:#fff;}
.tri.flat .tb.c0 h4,.tri.flat .tb.c3 h4{color:var(--navy);}
.tri.flat .tb b{font-weight:800;}

/* the two company pages are fixed-length copy, so spread their sections down
   the page rather than letting them bunch under the title */
.pg[data-key="about"] .pg-body,
.pg[data-key="studio"] .pg-body{justify-content:space-between;}

/* section rule + display line, mirrors "PRESENT YOUR PROPERTY RIGHT" */
.dline{text-align:center;margin:.26in 0 .18in;font:400 19pt/1.15 var(--serif);color:var(--navy);
  letter-spacing:.01em;}
.dline b{font-weight:700;}
.dline.sm{font-size:15pt;margin:.22in 0 .14in;}

/* p3 — about GVC: agent duo, headline stat, copy, value blocks.
   The roster headshots are transparent cutouts, so these sit on the bare page
   with a silhouette shadow rather than in a grey box: filter:drop-shadow
   follows the alpha channel, so the shadow traces the person instead of
   boxing them. That needs overflow:visible and object-fit:contain — the
   inherited .ph rules would clip the shadow and crop the head. */
/* the row has to be explicitly minmax(0,1fr), not the default auto: an auto
   row sizes to the cutout's intrinsic height, so .ph's height:100% would have
   nothing definite to resolve against and the block would overflow.
   Height is tuned to the cutouts' ~1:1 subject so contain barely letterboxes —
   any surplus lands above the head, which is what reads as a dead margin. */
.duo{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:minmax(0,1fr);
  gap:.26in;height:2.5in;flex:none;margin-bottom:.24in;}
/* grid, not flex: an <img> is a replaced element, so height:auto makes it
   claim its intrinsic height and it wins over flex-basis, pushing the caption
   off the bottom of the box. An explicit 1fr row plus height:100% pins it. */
.duo .ph{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;
  background:none;overflow:visible;}
.duo .ph img{width:100%;height:100%;min-height:0;
  object-fit:contain;object-position:50% 100%;
  filter:drop-shadow(.02in .05in .07in rgba(0,39,58,.34));}
.duo .cap{position:static;flex:none;margin-top:.13in;padding-top:.1in;text-align:center;
  border-top:1pt solid var(--sky);
  font:800 8pt var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--navy);}
.about-copy{font:300 9.3pt/14pt var(--body);color:var(--navy);text-align:center;margin-bottom:.22in;}
.about-copy b{font-weight:700;}

/* p4 — the marketing team as a flush 2x2 of members: each one is a square
   photo paired with a coloured name panel, alternating so the colours
   checkerboard across the block. Mirrors the reference deck. */
.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:0;flex:none;margin-bottom:.24in;}
.crew .cell{position:relative;aspect-ratio:1/1;overflow:hidden;min-width:0;}
.crew .cell.ph{background:rgba(0,39,58,.06);}
.crew .cell.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.crew .cell.lab{display:flex;flex-direction:column;justify-content:center;padding:.14in .16in;}
.crew .cell.lab.n1{background:var(--navy);}
.crew .cell.lab.n2{background:var(--sky2);}
.crew .cell.lab.n3{background:var(--sky);}
.crew .cell.lab.n4{background:#EDEDEB;}
.crew .cell.lab .nm{font:800 11pt/1.2 var(--sans);color:#fff;}
.crew .cell.lab .tt{margin-top:.06in;font:400 8.5pt/1.35 var(--body);
  text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.85);}
.crew .cell.lab.n3 .nm,.crew .cell.lab.n4 .nm{color:var(--navy);}
.crew .cell.lab.n3 .tt,.crew .cell.lab.n4 .tt{color:rgba(0,39,58,.75);}
/* right-hand members read outward, so their text hangs to the right */
.crew .cell.lab.r{text-align:right;}

/* p5 — property breakdown */
.pb-hero{height:2.75in;flex:none;margin-bottom:.26in;}
.pb-grid{display:flex;gap:.42in;flex:1;min-height:0;}
.pb-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.spec{display:flex;align-items:baseline;justify-content:space-between;gap:.16in;
  padding:.1in 0;border-bottom:.75pt solid var(--rule);}
.spec .k{font:800 7pt var(--sans);letter-spacing:.14em;text-transform:uppercase;color:rgba(0,39,58,.55);}
.spec .v{font:600 10pt var(--body);color:var(--navy);text-align:right;font-variant-numeric:tabular-nums;}
.feat{list-style:none;margin:0;padding:0;}
.feat li{position:relative;padding:.055in 0 .055in .22in;font:300 9.5pt/14pt var(--body);color:var(--navy);}
.feat li::before{content:'';position:absolute;left:0;top:.105in;width:.075in;height:.075in;background:var(--sky);}

/* p7 — comps table, more breathing room + small glyphs in the numeric heads */
#compTable th .hi{width:9pt;height:9pt;display:inline-block;vertical-align:-1.5pt;margin-right:.04in;color:rgba(0,39,58,.5);}
#compTable td{padding-top:.16in;padding-bottom:.16in;}

/* p8 — listing strategy. Each band carries the static strategy/risk pair
   from the reference deck; only the three prices come from the panel. */
.eval{text-align:center;font:700 10.5pt/15pt var(--body);color:var(--navy);
  margin:0 0 .26in;padding:0 .3in;}
.band{position:relative;}
.band .bsr{margin-top:.14in;padding-top:.11in;border-top:.75pt solid var(--rule);text-align:left;}
.band.mid .bsr{border-top-color:rgba(83,199,220,.4);}
.band .bsr div{font:300 8.3pt/12.5pt var(--body);color:rgba(0,39,58,.75);}
.band .bsr div + div{margin-top:.05in;}
.band .bsr b{font:800 6.8pt var(--sans);letter-spacing:.13em;text-transform:uppercase;
  color:rgba(0,39,58,.5);display:block;}
.band.mid .bsr div{color:rgba(229,229,229,.85);}
.band.mid .bsr b{color:var(--sky);}
.strat-note{margin-top:.28in;padding-top:.22in;border-top:.75pt solid var(--rule);
  font:300 9.5pt/14pt var(--body);color:rgba(0,39,58,.78);}
/* the reference closes this page on a property shot — it takes whatever
   height is left once the bands and the note are placed */
.strat-ph{flex:1;min-height:1.6in;margin-top:.28in;}

/* p9 — sales & marketing plan, three phases.
   Each phase carries its own accent, darkest to lightest as the listing moves
   from pre-launch through to on-going, so the three columns read as a sequence
   rather than three unrelated lists. The bullets pick up the same colour. */
.plan3{display:flex;gap:.3in;flex:1;min-height:0;}
.plan3 .ph3{flex:1;min-width:0;display:flex;flex-direction:column;}
.plan3 .ph3-h{flex:none;font:800 11pt var(--sans);letter-spacing:.03em;text-transform:uppercase;
  color:var(--navy);padding-bottom:.1in;border-bottom:2pt solid var(--sky);margin-bottom:.16in;}
.plan3 .ph3.p1 .ph3-h{border-bottom-color:var(--navy);}
.plan3 .ph3.p2 .ph3-h{border-bottom-color:var(--sky2);}
.plan3 .ph3.p3 .ph3-h{border-bottom-color:var(--sky);}
.plan3 .grp{margin-bottom:.16in;}
.plan3 .grp-t{font:800 7pt var(--sans);letter-spacing:.13em;text-transform:uppercase;color:rgba(0,39,58,.55);margin-bottom:.06in;}
.plan3 ul{list-style:none;margin:0;padding:0;}
.plan3 li{padding:.05in 0 .05in .16in;position:relative;font:300 8.8pt/13pt var(--body);color:var(--navy);}
.plan3 li::before{content:'';position:absolute;left:0;top:.095in;width:.06in;height:.06in;background:var(--sky2);}
.plan3 .ph3.p1 li::before{background:var(--navy);}
.plan3 .ph3.p2 li::before{background:var(--sky2);}
.plan3 .ph3.p3 li::before{background:var(--sky);}

/* p10 — preparing your home: the seller checklist, two icon-headed columns.
   Boxes are printed empty on purpose — the seller ticks them by hand. */
.prep{columns:2;column-gap:.55in;flex:1;min-height:0;}
.prep .pgrp{break-inside:avoid;margin-bottom:.3in;}
.prep .pgrp-h{display:flex;align-items:center;gap:.11in;margin-bottom:.13in;}
.prep .pgrp-h .ci{width:.2in;height:.2in;flex:none;color:var(--navy);}
.prep .pgrp-h span{font:800 9pt var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--navy);}
.prep ul{list-style:none;margin:0;padding:0;}
.prep li{display:flex;align-items:flex-start;gap:.14in;padding:.072in 0;
  font:300 10.5pt/15pt var(--body);color:var(--navy);}
.prep li i{flex:none;width:.16in;height:.16in;border:.75pt solid rgba(0,39,58,.45);
  display:block;margin-top:.028in;}
.prep li em{font-style:normal;color:rgba(0,39,58,.55);}

/* p11 — testimonials, editorial block quotes. space-evenly, not
   space-between: between pins the first and last quote hard against the top
   and bottom edges of the text block. */
/* the review-count badge. A flex item rather than absolutely positioned: the
   page body clips its overflow, and a floating badge would land on top of the
   first quote's closing mark. Sits right-aligned above the quotes. */
.rev-badge{flex:none;align-self:flex-end;display:flex;align-items:center;gap:.13in;
  background:var(--navy);padding:.1in .19in;margin-bottom:.2in;}
.rev-badge .rb-stars{color:var(--sky);font-size:9.5pt;line-height:1;letter-spacing:.06em;}
.rev-badge .rb-n{font:700 14pt/1 var(--serif);color:#fff;}
.rev-badge .rb-l{font:800 7pt var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:rgba(229,229,229,.85);}

.quotes{display:flex;flex-direction:column;justify-content:space-evenly;gap:.26in;flex:1;min-height:0;}
/* border-left:0 overrides the shared rule in pitch.css — the quote is framed
   by the pair of marks now, not by a rule down the side. */
.quote{flex:none;position:relative;border-left:0;padding-left:.52in;padding-right:.6in;}
.quote::before{content:'\201C';position:absolute;left:0;top:-.1in;font:700 46pt/1 var(--serif);color:var(--sky);}
/* closing mark hangs off the end of the text block, into the right padding */
.quote p{position:relative;margin:0;font:italic 400 15pt/23pt var(--body);color:var(--navy);}
.quote p::after{content:'\201D';position:absolute;right:-.56in;bottom:-.26in;
  font:700 56pt/1 var(--serif);color:var(--sky);}
.quote .who{margin-top:.12in;font:800 8pt var(--sans);letter-spacing:.16em;text-transform:uppercase;color:rgba(0,39,58,.55);}

/* p12 — professional videos: copy column beside three listing films */
.pv{display:flex;gap:.4in;flex:1;min-height:0;}
.pv .pv-copy{width:2.7in;flex:none;display:flex;flex-direction:column;justify-content:center;
  border-top:1.2pt solid var(--sky);border-bottom:1.2pt solid var(--sky);padding:.24in 0;}
.pv .pv-copy p{margin:0 0 .15in;font:300 9pt/13.5pt var(--body);color:var(--navy);text-align:justify;}
.pv .pv-copy p:last-child{margin-bottom:0;}
.pv .pv-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:.16in;}
.vid{flex:1;min-height:0;position:relative;overflow:hidden;background:rgba(0,39,58,.06);}
.vid img{width:100%;height:100%;object-fit:cover;display:block;}
.vid .vt{position:absolute;left:0;right:0;bottom:0;padding:.11in .16in;
  background:rgba(0,39,58,.82);font:800 9pt var(--sans);letter-spacing:.08em;
  text-transform:uppercase;color:#fff;}
.vid .vqr{position:absolute;top:.13in;right:.13in;width:.72in;height:.72in;
  background:#fff;padding:.045in;}
.vid .vqr svg,.vid .vqr img{width:100%;height:100%;display:block;object-fit:contain;}
.vid .vqr.todo{display:flex;align-items:center;justify-content:center;text-align:center;
  font:800 5.4pt/1.35 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:rgba(0,39,58,.55);}

/* ============================================================
   p13 — closing page
   ============================================================ */
.pg[data-key="contact"] .pg-body{justify-content:space-between;}

/* the three things that happen next */
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:.42in;flex:none;}
.steps3 .s{border-top:1.4pt solid var(--sky);padding-top:.15in;}
.steps3 .sn{font:800 8pt var(--sans);letter-spacing:.18em;color:var(--sky);}
.steps3 .st{margin-top:.1in;font:700 13pt/1.2 var(--serif);color:#fff;}
.steps3 .sd{margin-top:.08in;font:300 8.8pt/13pt var(--body);color:rgba(229,229,229,.78);}

/* agents. The cutout sits on a light panel so the shadow and the name band
   have something solid to sit against. */
.pg[data-key="contact"] .ag-row{gap:.55in;flex:none;justify-content:center;}
.ag-c{flex:0 1 2.5in;max-width:2.5in;text-align:left;}
/* Square panel, deliberately: the cutouts' subjects are all ~1:1, so a 4:5
   portrait panel made contain letterbox by 20% and object-position:bottom
   dumped every bit of it above the head. Matching the panel to the subject
   removes the gap without cover-cropping anyone's arms — the roster framings
   vary too much for that to be safe. The band overlaps the chest. */
.ag-c .shot{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;
  background:linear-gradient(#F4F3EF,#E4E2DC);box-shadow:0 .14in .3in rgba(0,0,0,.4);}
.ag-c .shot img{width:100%;height:100%;display:block;
  object-fit:contain;object-position:50% 100%;}
.ag-c .shot .band{position:absolute;left:0;right:0;bottom:0;padding:.1in .15in;
  background:rgba(0,39,58,.9);}
.ag-c .shot .band .bnm{font:700 13pt/1.15 var(--serif);color:#fff;}
.ag-c .tt{margin-top:.13in;font:800 6.8pt/1.5 var(--sans);letter-spacing:.14em;
  text-transform:uppercase;color:var(--sky);}
.ag-c .ct{margin-top:.07in;display:flex;flex-direction:column;gap:.02in;}
.ag-c .ct span{font:300 9pt/1.5 var(--body);color:var(--ow);}

/* footer: two link columns and the team-site QR on one baseline */
.contact-foot{flex:none;display:flex;align-items:flex-start;gap:.42in;
  padding-top:.26in;border-top:1pt solid var(--rule-rev);}
.lcols{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:.42in;}
.lcol{min-width:0;}
.lcol-t{font:800 7pt var(--sans);letter-spacing:.18em;text-transform:uppercase;
  color:var(--sky);padding-bottom:.08in;margin-bottom:.1in;border-bottom:.75pt solid var(--rule-rev);}
.lrow{display:flex;flex-direction:column;margin-bottom:.09in;min-width:0;}
.lrow .lk{font:800 6.2pt var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:rgba(229,229,229,.5);}
.lrow .lv{font:300 9pt/1.4 var(--body);color:var(--ow);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-qr{flex:none;width:1in;text-align:center;}
.cf-qr .qbox{width:1in;height:1in;background:#fff;padding:.05in;}
.cf-qr .qbox svg{width:100%;height:100%;display:block;}
.cf-qr .qcap{margin-top:.07in;font:800 6pt var(--sans);letter-spacing:.12em;
  text-transform:uppercase;color:rgba(229,229,229,.6);}

/* the three states we are licensed in */
.states{flex:none;display:flex;justify-content:center;gap:.42in;margin-top:.24in;}
.states span{position:relative;font:800 7.5pt var(--sans);letter-spacing:.18em;
  text-transform:uppercase;color:rgba(229,229,229,.72);}
.states span + span::before{content:'';position:absolute;left:-.21in;top:.035in;
  width:.05in;height:.05in;background:var(--sky);}
</style>
</head>
<body data-root="../../" data-nav="tools">
<main>
<h1 class="visually-hidden">Seller Pitch &amp; CMA Builder</h1>

<div id="app">

  <!-- ======================= EDITOR ======================= -->
  <aside id="editor">
    <div class="ed-top">
      <button class="btn sm" id="btnSample">Fill with sample info</button>
    </div>
    <div class="ed-body">

      <details class="ed-sec">
        <summary>Property <span class="hint">cover + page 5</span></summary>
        <div class="sec-in">
          <div class="field"><label>Address</label><input type="text" data-f="address" placeholder="45 Crosby Street, Penthouse"></div>
          <div class="f-row">
            <div class="field"><label>City</label><input type="text" data-f="city" placeholder="New York"></div>
            <div class="field"><label>State</label><input type="text" data-f="state" placeholder="NY"></div>
            <div class="field"><label>ZIP</label><input type="text" data-f="zip" placeholder="10012"></div>
          </div>
          <div class="f-row">
            <div class="field"><label>Beds</label><input type="text" data-f="beds" placeholder="3"></div>
            <div class="field"><label>Baths</label><input type="text" data-f="baths" placeholder="2.5"></div>
            <div class="field"><label>Sq ft</label><input type="text" data-f="sqft" placeholder="2,410"></div>
          </div>
          <div class="f-row">
            <div class="field"><label>Type</label><input type="text" data-f="ptype" placeholder="Condominium"></div>
            <div class="field"><label>Year built</label><input type="text" data-f="year" placeholder="1899"></div>
          </div>
          <div class="f-row">
            <div class="field"><label>Taxes / yr</label><input type="text" data-f="taxes" placeholder="18,400"></div>
            <div class="field"><label>Common charges / mo</label><input type="text" data-f="cc" placeholder="2,150"></div>
          </div>
          <div class="field"><label>Property description</label>
            <textarea data-f="blurb" rows="4" placeholder="Two sentences on what makes this home sell."></textarea></div>
          <div class="field"><label>Key features <span style="text-transform:none;letter-spacing:0">(one per line)</span></label>
            <textarea data-f="features" rows="5" placeholder="Private keyed elevator&#10;Chef's kitchen, Wolf &amp; Sub-Zero"></textarea></div>
          <div class="warn" id="warnProperty" hidden></div>
        </div>
      </details>

      <details class="ed-sec">
        <summary>Client &amp; cover</summary>
        <div class="sec-in">
          <div class="field"><label>Prepared for</label><input type="text" data-f="client" placeholder="Mr. &amp; Mrs. Harrington"></div>
          <div class="field"><label>Date</label><input type="text" data-f="date" placeholder="August 2026"></div>
        </div>
      </details>

      <details class="ed-sec">
        <summary>Photos</summary>
        <div class="sec-in">
          <div class="drop" id="dropPhotos" tabindex="0" role="button">
            <div class="d-big">Drop photos</div>
            <div class="d-sub">First is the cover, second is the property hero</div>
          </div>
          <input type="file" id="filePhotos" accept="image/*" multiple hidden>
          <div id="imgList"></div>
          <div class="drop" id="dropMap" tabindex="0" role="button" style="margin-top:14px">
            <div class="d-big">Drop past-sales map</div>
            <div class="d-sub">Export one from Map Studio</div>
          </div>
          <input type="file" id="fileMap" accept="image/*" hidden>
          <div class="thumbs" id="thumbsMap"></div>
        </div>
      </details>

      <details class="ed-sec">
        <summary>Comparable sales</summary>
        <div class="sec-in">
          <div class="rowlist" id="compList"></div>
          <button class="btn sm ghost" id="addComp" style="margin-top:10px">Add comparable</button>
          <div class="warn" id="warnComps" hidden></div>
        </div>
      </details>

      <details class="ed-sec">
        <summary>Listing strategy</summary>
        <div class="sec-in">
          <div class="f-row">
            <div class="field"><label>Low range</label><input type="text" data-f="priceLow" placeholder="3,450,000"></div>
            <div class="field"><label>Mid range</label><input type="text" data-f="priceMid" placeholder="3,695,000"></div>
            <div class="field"><label>High range</label><input type="text" data-f="priceHigh" placeholder="3,950,000"></div>
          </div>
          <div class="field"><label>Recommended range</label>
            <div class="seg pick" id="recPick" role="group" aria-label="Recommended range">
              <button type="button" data-rec="low">Low</button>
              <button type="button" data-rec="mid">Mid</button>
              <button type="button" data-rec="high">High</button>
            </div>
          </div>
          <div class="warn" id="warnStrategy" hidden></div>

/* QR as vector SVG so it stays crisp at any print size. Same approach as
   the showsheet. Returns '' for an empty url or if the CDN script failed,
   and the caller prints a placeholder instead. */
function qrSvg(text) {
  try {
    if (!text || typeof qrcode === 'undefined') return '';
    const qr = qrcode(0, 'M');
    qr.addData(text); qr.make();
    const n = qr.getModuleCount();
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
    return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" ' +
           'xmlns="http://www.w3.org/2000/svg"><path d="' + d + '" fill="#00273A"/></svg>';
  } catch (e) { return ''; }
}

    title:'Comparable Sales', body });
}

/* The three prices and which band is recommended come from the panel. The
   strategy/risk pairs are fixed — the same argument on every listing. */
const BANDS = [
  ['low',  'Low Range',  'priceLow',
   'Peak interest for a possible bidding war and sell quick', 'Leave money on the table'],
  ['mid',  'Mid Range',  'priceMid',
   'Highest chance for multiple offers and quicker sale', 'Low risk'],
  ['high', 'High Range', 'priceHigh',
   'Possibly get more money', 'Increased time it takes to sell or significant price drop']
];

function pgStrategy(n) {
  const body =
    '<div class="lede" style="text-align:center;max-width:none">A home priced right will attract a ' +
    'greater number of interested buyers.</div>' +
    '<div class="eval">After a personal consultation and a thorough assessment of your home, we will ' +
    'provide you with our expert evaluation of its value.</div>' +
    '<div class="bands">' + BANDS.map(([id, lab, key, strat, risk]) =>
      '<div class="band' + (state.recBand === id ? ' mid' : '') + '">' +
        '<div class="bl">' + lab + '</div>' +
        '<div class="bv">' + (state[key] ? P.money(state[key]) : '$ —') + '</div>' +
        '<div class="bsr">' +
          '<div><b>Strategy</b>' + strat + '</div>' +
          '<div><b>Risk</b>' + risk + '</div>' +
        '</div>' +
      '</div>').join('') + '</div>' +
    '<div class="strat-note">Price is the single biggest lever we control. Go out too high and the ' +
    'listing goes stale &mdash; buyers read days-on-market before they read the description. Go out too ' +
    'low and you leave money on the table. The three numbers above are the honest range the comparables ' +
    'support, and the highlighted one is where we would go to market.</div>' +
    '<div class="ph strat-ph"' + (slot('strategy') ? ' data-pos="strategy"' : '') + '>' + (slot('strategy')
      ? '<img src="' + slot('strategy') + '" alt="" style="object-position:' +
          posFor('strategy').x + '% ' + posFor('strategy').y + '%">'
      : '<div class="empty-note on-white">Tag a photo &ldquo;Strategy page&rdquo;</div>') + '</div>';
  return P.page({ deck:DECK, n, of:OF, site:state.site,
    title:'The Listing Strategy', body });
}

/* Static GVC boilerplate — pre-launch, launch and on-going, grouped from
   DEFAULT_PLAN (Phase | Group | Title | detail). Not editor-driven. */
function pgPlan(n) {
  const rows = planRows(DEFAULT_PLAN);
  const phases = ['Pre-Launch', 'Launch', 'On-Going'];
  /* p1/p2/p3 carry the phase accent — navy, mid, then light */
  const col = (phase, i) => {
    const rs = rows.filter(r => r[0] === phase);
    const groups = [];
    rs.forEach(r => {
      let g = groups.filter(x => x.name === r[1])[0];
      if (!g) { g = { name: r[1], items: [] }; groups.push(g); }
      g.items.push(r[2] + (r[3] ? ' — ' + r[3] : ''));
    });
    return '<div class="ph3 p' + (i + 1) + '"><div class="ph3-h">' + phase + '</div>' +
      groups.map(g => '<div class="grp"><div class="grp-t">' + g.name + '</div><ul>' +
        g.items.map(t => '<li>' + t + '</li>').join('') + '</ul></div>').join('') + '</div>';
  };
  const body = '<div class="plan3">' + phases.map(col).join('') + '</div>';
  return P.page({ deck:DECK, n, of:OF, site:state.site,
    title:'Marketing Plan', body });
}

/* The seller's own prep checklist. Boxes print empty — this page is meant to
   be handed over and ticked off, so nothing here is editor-driven. */
function pgPrep(n) {
  const body =
    '<div class="prep">' + PREP.map(([name, ic, items]) =>
      '<div class="pgrp"><div class="pgrp-h">' + (window.icon ? window.icon(ic, 'ci') : '') +
        '<span>' + name + '</span></div><ul>' +
        items.split(';').map(t => '<li><i></i><span>' + t + '</span></li>').join('') +
      '</ul></div>').join('') + '</div>';
  return P.page({ deck:DECK, n, of:OF, site:state.site,
    title:'The Sales Plan', body });
}

/* Static GVC boilerplate — curated from client testimonials, not editor-driven. */
function pgReviews(n) {
  const rs = pairs(DEFAULT_REVIEWS);
  const body =
    '<div class="rev-badge">' +
      '<div class="rb-stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>' +
      '<div class="rb-n">50+</div>' +
      '<div class="rb-l">5-star reviews</div>' +
    '</div>' +
    '<div class="quotes">' + rs.map(([q, who]) =>
    '<div class="quote"><p>' + esc(q) + '</p>' +
    (who ? '<div class="who">' + esc(who) + '</div>' : '') + '</div>').join('') + '</div>';
  return P.page({ deck:DECK, n, of:OF, site:state.site,
    title:'What Our Clients Say', body });
}

/* Three real listing films — all three cards are driven by the VIDEOS block
   near the top of this file. Photo falls back to the panel's Video N slot so a
   dropped photo still works; QR prefers a supplied image, else draws itself
   from the url, else prints a placeholder rather than a dead code. */
function pgVideos(n) {
  const body =
    '<div class="pv">' +
      '<div class="pv-copy">' + VIDEO_COPY.map(p => '<p>' + p + '</p>').join('') + '</div>' +
      '<div class="pv-list">' + VIDEOS.slice(0, 3).map((v, i) => {
        const key = 'video' + (i + 1), img = v.photo || slot(key);
        const code = v.qr
          ? '<img src="' + v.qr + '" alt="">'
          : qrSvg(v.url);
        return '<div class="vid"' + (img ? ' data-pos="' + key + '"' : '') + '>' +
          (img
            ? '<img src="' + img + '" alt="" style="object-position:' + posFor(key).x + '% ' + posFor(key).y + '%">'
            : '<div class="empty-note on-white">Tag a photo &ldquo;' + esc('Video ' + (i + 1) + ' still') + '&rdquo;</div>') +
          '<div class="vqr' + (code ? '' : ' todo') + '">' + (code || 'Video<br>link<br>needed') + '</div>' +
          '<div class="vt">' + esc(v.title) + '</div>' +
        '</div>';
      }).join('') + '</div>' +
    '</div>';
  return P.page({ deck:DECK, n, of:OF, site:state.site,
    title:'Professional Videos', body });
}

/* Closing page. Three things that happen next, then the agents as proper
   cards, then one tidy footer block. The headshots are transparent cutouts,
   so each sits on its own light panel — that is what carries the drop shadow
   and the name banner. A shadow on the bare cutout draws an empty rectangle. */
const NEXT_STEPS = [
  ['Agree on a number', 'We review the comparables together and settle on the range we go out at.'],
  ['Book the shoot',    'Photography, floor plan and film scheduled, usually within the first week.'],
  ['Go to market',      'Elliman, StreetEasy and the full syndication list on launch day.']
];

function pgContact(n) {
  const list = agents();
  const cards = list.length
    ? '<div class="ag-row">' + list.map(a =>
        '<div class="ag-c">' +
          '<div class="shot"><img src="' + headshotFor(a) + '" alt="">' +
            '<div class="band"><div class="bnm">' + esc(a.name) + '</div></div>' +
          '</div>' +
          '<div class="tt">' + esc(a.title) + '</div>' +
          '<div class="ct">' +
            (a.phone ? '<span>' + esc(a.phone) + '</span>' : '') +
            (a.email ? '<span>' + esc(a.email) + '</span>' : '') +
          '</div>' +
        '</div>').join('') + '</div>'
    : '<div class="ag-row"><div class="ag-c"><div class="shot">' +
      '<div class="empty-note">Pick an agent<br>in the Agents panel</div></div></div></div>';

  const linkCol = (heading, arr) =>
    '<div class="lcol"><div class="lcol-t">' + heading + '</div>' + arr.map(([k, v]) =>
      '<div class="lrow"><span class="lk">' + esc(k) + '</span>' +
      '<span class="lv">' + esc(v) + '</span></div>').join('') + '</div>';

  const site = 'https://' + String(state.site || 'gvcrealestateteam.com').replace(/^https?:\/\//, '');
  const qr = qrSvg(site);

  const body =
    '<div class="steps3">' + NEXT_STEPS.map(([t, d], i) =>
      '<div class="s"><div class="sn">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="st">' + t + '</div><div class="sd">' + d + '</div></div>').join('') + '</div>' +
    cards +
    '<div class="contact-foot">' +
      '<div class="lcols">' +
        linkCol('Social', pairs(DEFAULT_SOCIAL)) +
        linkCol('Links', pairs(DEFAULT_LINKS)) +
      '</div>' +
      (qr ? '<div class="cf-qr"><div class="qbox">' + qr + '</div>' +
            '<div class="qcap">Our team site</div></div>' : '') +
    '</div>' +
    '<div class="states"><span>New York</span><span>New Jersey</span><span>Florida</span></div>';
  return P.page({ deck:DECK, n, of:OF, site:state.site, reversed:true,
    title:'Next Steps', body });
}

const RENDER = {
  cover:pgCover, toc:pgToc, about:pgAbout, studio:pgStudio, property:pgProperty,
  map:pgMap, comps:pgComps, strategy:pgStrategy, plan:pgPlan, prep:pgPrep,
  reviews:pgReviews, videos:pgVideos, contact:pgContact
};

/* ============================================================
   WIRING
   ============================================================ */
let builder = null;

function redraw() {
  if (!builder) return;
  reassign();
  builder.rebuild();
  paintPhotos();
  P.wirePhotoDrag(document.getElementById('pages'), state.pos);
  // setTimeout, not rAF: rAF is suspended while the tab is not rendering,
  // which silently skips the overflow check.
  setTimeout(checkAll, 0);
}

const RULES = [
  { key:'comps',    box:'warnComps',   msg:'Comparable sales run past the page — remove one, or shorten the longest address.' },
  { key:'property', box:'warnProperty',msg:'The property page is over-full — shorten the description or cut a feature.' },
  { key:'strategy', box:'warnStrategy',msg:'The strategy page is over-full — a price is running onto a second line.' }
];
function checkAll() {
  P.checkOverflow(document.getElementById('pages'), RULES, 'warnGeneral');
}

function bindFields() {
  document.querySelectorAll('[data-f]').forEach(el => {
    const k = el.dataset.f;
    el.value = state[k] || '';
    el.addEventListener('input', () => { state[k] = el.value; redraw(); });
  });
}

/* comps are a repeating row, so they get their own tiny list editor */
function renderComps() {
  const host = document.getElementById('compList');
  host.innerHTML = '';
  state.comps.forEach((c, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'rw';
    const mk = (ph, key, w) => {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.placeholder = ph; inp.value = c[key] || '';
      if (w) inp.style.flex = '0 0 ' + w;
      inp.addEventListener('input', () => { c[key] = inp.value; redraw(); });
      return inp;
    };
    wrap.appendChild(mk('Address', 'address'));
    wrap.appendChild(mk('Sold $', 'price', '68px'));
    wrap.appendChild(mk('Sq ft', 'sqft', '52px'));
    wrap.appendChild(mk('Bd/Ba', 'bb', '52px'));
    wrap.appendChild(mk('Date', 'date', '58px'));
    const x = document.createElement('button');
    x.type = 'button'; x.className = 'x'; x.textContent = '×';
    x.addEventListener('click', () => { state.comps.splice(i, 1); renderComps(); redraw(); });
    wrap.appendChild(x);
    host.appendChild(wrap);
  });
}

function renderThumbs(hostId, arr, onRemove) {
  const host = document.getElementById(hostId);
  host.innerHTML = '';
  arr.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const img = document.createElement('img'); img.src = p.url; img.alt = '';
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '×';
    b.addEventListener('click', () => { onRemove(i); });
    d.appendChild(img); d.appendChild(b); host.appendChild(d);
  });
}

function loadPreview() {
  Object.assign(state, {
    address:'45 Crosby Street, Penthouse', city:'New York', state:'NY', zip:'10012',
    beds:'3', baths:'2.5', sqft:'2,410', ptype:'Condominium', year:'1899',
    taxes:'18400', cc:'2150',
    blurb:'A full-floor penthouse in a cast-iron SoHo loft building, with 12-foot ceilings, ' +
          'four exposures and a 900-square-foot planted terrace. Converted in 2019 and barely lived in since.',
    features:'Private keyed elevator, opens into the great room\nChef’s kitchen — Wolf range, Sub-Zero, honed marble\n900 sq ft landscaped terrace with irrigation\nOriginal cast-iron columns, restored\nPrimary suite with dressing room\nVented washer / dryer in unit\nCentral heat and cooling, zoned\nStorage unit conveys',
    client:'Mr. & Mrs. Harrington', date:'August 2026',
    comps:[
      {address:'62 Greene Street, 4W', price:'3550000', sqft:'2280', bb:'3 / 2.5', date:'Jun 2026'},
      {address:'110 Mercer Street, PH', price:'4100000', sqft:'2610', bb:'3 / 3', date:'May 2026'},
      {address:'28 Wooster Street, 3', price:'3275000', sqft:'2190', bb:'3 / 2', date:'Apr 2026'},
      {address:'155 Grand Street, 6A', price:'3690000', sqft:'2400', bb:'3 / 2.5', date:'Mar 2026'},
      {address:'80 Greene Street, 5', price:'3425000', sqft:'2340', bb:'3 / 2.5', date:'Feb 2026'}
    ],
    priceLow:'3450000', priceMid:'3695000', priceHigh:'3950000',
    agents:['john-gasdaska','tj-verdiglione']
  });
  // real photography from photos/3-crosby-lane, invented listing copy.
  // One per slot: cover, hero, strategy, then the three video stills.
  state.photos = [0, 3, 6, 9, 12, 15].map(n => ({
    id: ++uid,
    name: '3-crosby-' + n + '.webp',
    url: '../../photos/3-crosby-lane/img/' + n + '-e-f.webp',
    role: 'auto'
  }));
  state.pos = {};
  state.map = null;
  document.querySelectorAll('[data-f]').forEach(el => { el.value = state[el.dataset.f] || ''; });
  renderComps(); paintRoster(); paintRec(); paintMap(); redraw();
}

let paintRoster = () => {}, paintRec = () => {};

/* Which of the three ranges carries the star. Returns a repaint function so
   the sample loader can re-sync the buttons with state. */
function wireRecPick() {
  const host = document.getElementById('recPick');
  const btns = [...host.querySelectorAll('button')];
  const paint = () => btns.forEach(b => b.classList.toggle('on', b.dataset.rec === state.recBand));
  btns.forEach(b => b.addEventListener('click', () => {
    state.recBand = b.dataset.rec;
    paint(); redraw();
  }));
  paint();
  return paint;
}

document.addEventListener('DOMContentLoaded', () => {
  bindFields();
  renderComps();

  P.wireDrop(document.getElementById('dropPhotos'), document.getElementById('filePhotos'), files => {
    files.forEach(f => state.photos.push({ id: ++uid, name: f.name, url: f.url, role: 'auto' }));
    redraw();
  });
  P.wireDrop(document.getElementById('dropMap'), document.getElementById('fileMap'), files => {
    state.map = files[0];
    paintMap(); redraw();
  });

  paintRoster = P.wireRoster(document.getElementById('rosterPick'), state, 2, redraw);

  document.getElementById('addComp').addEventListener('click', () => {
    state.comps.push({ address:'', price:'', sqft:'', bb:'', date:'' });
    renderComps(); redraw();
  });
  document.getElementById('btnSample').addEventListener('click', loadPreview);
  paintRec = wireRecPick();

  builder = Builder.init({
    pages: PAGES.length,
    label: 'Page',
    render: (page, i) => {
      page.innerHTML = RENDER[PAGES[i].key](i + 1);
      // tag the rendered page so the overflow check can name it
      const pg = page.querySelector('.pg');
      if (pg) { pg.dataset.key = PAGES[i].key; pg.dataset.n = String(i + 1); }
    }
  });
  document.fonts && document.fonts.ready.then(() => setTimeout(checkAll, 0));
  setTimeout(checkAll, 0);
});

function paintPhotos() {
  P.renderPhotoList(document.getElementById('imgList'), state.photos, ROLES, assign, {
    onChange: redraw,
    onRemove: img => { state.photos = state.photos.filter(x => x.id !== img.id); redraw(); }
  });
}
function paintMap() {
  renderThumbs('thumbsMap', state.map ? [state.map] : [], () => {
    state.map = null; paintMap(); redraw();
  });
}
</script>
