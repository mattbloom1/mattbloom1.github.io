<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feet &amp; Inches Calculator</title>
<style>
  :root {
    --bg: #1e1f24;
    --panel: #2a2c33;
    --panel-2: #34373f;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #4f8cff;
    --accent-hover: #3a78f0;
    --danger: #d9534f;
    --border: #3f4248;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app { width: 100%; max-width: 520px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .mode-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .mode-bar .label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .mode-switch {
    display: inline-flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 3px;
    gap: 3px;
  }
  .mode-switch button {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 6px 14px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    min-width: 56px;
  }
  .mode-switch button.active[data-mode="add"] {
    background: #2f4a33;
    color: #8ee097;
  }
  .mode-switch button.active[data-mode="sub"] {
    background: #4a2f2f;
    color: #ff9a95;
  }
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 32px;
    gap: 10px;
    align-items: center;
  }
  .row .num { color: var(--muted); font-size: 13px; text-align: right; }
  .field { position: relative; }
  .field input {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 44px 10px 12px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .field input:focus { border-color: var(--accent); }
  .field .unit {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
  .remove-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    line-height: 1;
  }
  .remove-btn:hover { color: var(--danger); background: rgba(217, 83, 79, 0.1); }
  .remove-btn:disabled { opacity: 0; pointer-events: none; }
  .header-row {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 32px;
    gap: 10px;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .header-row .h { padding-left: 4px; }
  .actions { margin-top: 14px; display: flex; gap: 10px; }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 9px 14px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }
  .result {
    margin-top: 20px;
    padding: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .result-label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .result-main { font-size: 28px; font-weight: 600; color: var(--text); }
  .result-secondary {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Feet &amp; Inches Calculator</h1>
    <div class="subtitle">Add measurements together. Tab to move between fields &mdash; a new row appears automatically.</div>

    <div class="panel">
      <div class="mode-bar">
        <span class="label">Operation</span>
        <div class="mode-switch" id="modeSwitch" role="tablist">
          <button type="button" data-mode="add" class="active" tabindex="-1">Add</button>
          <button type="button" data-mode="sub" tabindex="-1">Subtract</button>
        </div>
      </div>
      <div class="header-row">
        <div></div>
        <div class="h">Feet</div>
        <div class="h">Inches</div>
        <div></div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="actions">
        <button class="primary" id="addBtn" type="button">+ Add row</button>
        <button class="ghost" id="clearBtn" type="button">Clear all</button>
      </div>
    </div>

    <div class="result">
      <div class="result-label">Total</div>
      <div class="result-main" id="total">0' 0"</div>
      <div class="result-secondary">
        <div id="totalInches">0 inches</div>
        <div id="totalDecimal">0 feet</div>
      </div>
    </div>
  </div>

<script>
  const rowsEl = document.getElementById('rows');
  const totalEl = document.getElementById('total');
  const totalInchesEl = document.getElementById('totalInches');
  const totalDecimalEl = document.getElementById('totalDecimal');
  const modeSwitch = document.getElementById('modeSwitch');
  let mode = 'add';

  function makeField(cls, unitLabel) {
    const field = document.createElement('div');
    field.className = 'field';
    const input = document.createElement('input');
    input.type = 'number';
    input.step = 'any';
    input.inputMode = 'decimal';
    input.className = cls;
    input.placeholder = '0';
    const unit = document.createElement('span');
    unit.className = 'unit';
    unit.textContent = unitLabel;
    field.appendChild(input);
    field.appendChild(unit);
    return { field, input };
  }

  function makeRow() {
    const row = document.createElement('div');
    row.className = 'row';

    const num = document.createElement('div');
    num.className = 'num';
    row.appendChild(num);

    const feetField = makeField('feet', 'ft');
    const inchesField = makeField('inches', 'in');
    row.appendChild(feetField.field);
    row.appendChild(inchesField.field);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.type = 'button';
    removeBtn.title = 'Remove row';
    removeBtn.tabIndex = -1;
    removeBtn.textContent = '×';
    row.appendChild(removeBtn);

    [feetField.input, inchesField.input].forEach(input => {
      input.addEventListener('input', () => {
        ensureTrailingEmptyRow();
        recalc();
      });
    });

    removeBtn.addEventListener('click', () => {
      row.remove();
      renumber();
      ensureTrailingEmptyRow();
      recalc();
    });

    rowsEl.appendChild(row);
    renumber();
    return row;
  }

  function renumber() {
    const rows = Array.from(rowsEl.children);
    rows.forEach((r, i) => {
      r.querySelector('.num').textContent = (i + 1) + '.';
    });
    if (rows.length === 1) {
      rows[0].querySelector('.remove-btn').disabled = true;
    } else {
      rows.forEach(r => { r.querySelector('.remove-btn').disabled = false; });
    }
  }

  function rowIsEmpty(row) {
    const inputs = row.querySelectorAll('input');
    return inputs[0].value.trim() === '' && inputs[1].value.trim() === '';
  }

  function ensureTrailingEmptyRow() {
    const rows = Array.from(rowsEl.children);
    if (rows.length === 0) {
      makeRow();
      return;
    }
    const last = rows[rows.length - 1];
    if (!rowIsEmpty(last)) {
      makeRow();
    }
  }

  function parseNum(v) {
    if (v == null) return 0;
    const s = String(v).trim();
    if (s === '') return 0;
    const n = Number(s);
    return isFinite(n) ? n : 0;
  }

  function recalc() {
    const rows = Array.from(rowsEl.children);
    let totalInches = 0;
    rows.forEach((row, idx) => {
      const inputs = row.querySelectorAll('input');
      const rowInches = parseNum(inputs[0].value) * 12 + parseNum(inputs[1].value);
      const sign = (mode === 'sub' && idx > 0) ? -1 : 1;
      totalInches += sign * rowInches;
    });

    const negative = totalInches < 0;
    const abs = Math.abs(totalInches);
    const feet = Math.floor(abs / 12);
    const inches = abs - feet * 12;
    const sign = negative ? '-' : '';

    totalEl.textContent = sign + feet + "' " + formatNumber(inches) + '"';
    totalInchesEl.textContent = formatNumber(totalInches) + ' inches';
    totalDecimalEl.textContent = formatNumber(totalInches / 12) + ' feet (decimal)';
  }

  function formatNumber(n) {
    if (!isFinite(n)) return '0';
    const rounded = Math.round(n * 10000) / 10000;
    return rounded.toString();
  }

  modeSwitch.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    mode = btn.dataset.mode;
    Array.from(modeSwitch.querySelectorAll('button')).forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    recalc();
  });

  document.getElementById('addBtn').addEventListener('click', () => {
    const row = makeRow();
    row.querySelector('input').focus();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    while (rowsEl.firstChild) rowsEl.removeChild(rowsEl.firstChild);
    makeRow();
    makeRow();
    recalc();
    rowsEl.querySelector('input').focus();
  });

  makeRow();
  makeRow();
  recalc();
  rowsEl.querySelector('input').focus();
</script>
</body>
</html>
